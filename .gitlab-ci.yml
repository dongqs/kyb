# CI for kyb — plain Ruby CLI with minitest
#
# When pipelines run:
# - Merge request: yes
# - Push to default branch: yes
# - Push to other branches without MR: no
# - "Run pipeline" and scheduled pipelines from GitLab UI: yes
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - when: never

image: cr-public-proxy.infra.leyantech.com/library/ruby:3.3

stages:
  - test

test:
  stage: test
  before_script:
    - mkdir -p ~/.config/kyb
    - 'echo "base: {}" > ~/.config/kyb/config.yml'
    - bundle install
  script:
    - ruby -Itest -e 'Dir["test/test_*.rb"].sort.reject { |f| %w[test/test_helper.rb test/test_stale.rb test/test_stale_cli.rb].include?(f) }.each { |f| require_relative f }'
