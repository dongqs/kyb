# CI for kyb — plain Ruby CLI with minitest
#
# When pipelines run:
# - Merge request: yes
# - Push to default branch: yes
# - Push to other branches without MR: no
# - "Run pipeline" and scheduled pipelines from GitLab UI: yes
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - when: never

image: cr-public-proxy.infra.leyantech.com/library/ruby:3.3

stages:
  - test

test:
  stage: test
  script:
    - ruby -Itest -e "Dir['test/*.rb'].sort.each { |f| require_relative f }"
