#cloud-config
# OrbStack Machine cloud-init for AI dev sandbox
# Usage: bin/create-machine

hostname: dev-sandbox
timezone: Asia/Shanghai

# Create default user before write_files/runcmd need it
users:
  - name: __USER__
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: false
    home: /home/__USER__

# Aliyun mirror for Ubuntu ARM (ports)
apt:
  primary:
    - arches: [arm64, armhf, default]
      uri: http://mirrors.aliyun.com/ubuntu-ports/
  security:
    - arches: [arm64, armhf, default]
      uri: http://mirrors.aliyun.com/ubuntu-ports/

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - wget
  - git
  - build-essential
  - libpq-dev
  - libssl-dev
  - libreadline-dev
  - zlib1g-dev
  - vim
  - tmux
  - htop
  - gnupg
  - unzip
  - jq
  - docker-compose-v2

write_files:
  # --- Proxy: ALL_PROXY for socks5, NO_PROXY bypasses intranet ---
  - path: /etc/environment
    permissions: "0644"
    content: |
      ALL_PROXY=socks5://host.orb.internal:2080
      all_proxy=socks5://host.orb.internal:2080
      NO_PROXY=git.leyantech.com,localhost,127.0.0.1,host.orb.internal,.local,.internal
      no_proxy=git.leyantech.com,localhost,127.0.0.1,host.orb.internal,.local,.internal

  # --- Docker daemon with registry mirror ---
  - path: /etc/docker/daemon.json
    permissions: "0644"
    content: |
      {
        "registry-mirrors": [
          "https://docker.1ms.run",
          "https://docker.xuanyuan.me"
        ]
      }

  # --- bash_profile: ensures login shells source bashrc (for mise activation) ---
  - path: /home/__USER__/.bash_profile
    permissions: "0644"
    content: |
      [ -f ~/.bashrc ] && . ~/.bashrc

  # --- SSH: base64-encoded private key, decoded in runcmd ---
  - path: /home/__USER__/.ssh/id_rsa.b64
    permissions: "0600"
    content: __SSH_PRIVATE_KEY_B64__

  - path: /home/__USER__/.ssh/id_rsa.pub
    permissions: "0644"
    content: __SSH_PUBLIC_KEY__

  - path: /home/__USER__/.ssh/config
    permissions: "0644"
    content: |
      Host git.leyantech.com
        HostName git.leyantech.com
        User git
        IdentityFile ~/.ssh/id_rsa
        StrictHostKeyChecking accept-new

  # --- Git ---
  - path: /home/__USER__/.gitconfig
    permissions: "0644"
    content: |
      [user]
        name = __GIT_NAME__
        email = __GIT_EMAIL__
      [url "git@git.leyantech.com:"]
        insteadOf = https://git.leyantech.com/
      [http]
        proxy = socks5://host.orb.internal:2080

  # --- npm ---
  - path: /home/__USER__/.npmrc
    permissions: "0644"
    content: |
      registry=https://registry.npmmirror.com

  # --- Ruby ---
  - path: /home/__USER__/.gemrc
    permissions: "0644"
    content: |
      ---
      sources:
        - https://gems.ruby-china.com

  # --- pip ---
  - path: /home/__USER__/.pip/pip.conf
    permissions: "0644"
    content: |
      [global]
      index-url = https://mirrors.aliyun.com/pypi/simple/

  # --- Claude Code ---
  - path: /home/__USER__/.claude/settings.json
    permissions: "0644"
    content: |
      {
        "env": {
          "ANTHROPIC_AUTH_TOKEN": "__ANTHROPIC_AUTH_TOKEN__",
          "ANTHROPIC_BASE_URL": "https://api.deepseek.com/anthropic",
          "ANTHROPIC_DEFAULT_HAIKU_MODEL": "deepseek-v4-flash",
          "ANTHROPIC_DEFAULT_OPUS_MODEL": "deepseek-v4-pro[1m]",
          "ANTHROPIC_DEFAULT_SONNET_MODEL": "deepseek-v4-pro[1m]",
          "ANTHROPIC_MODEL": "deepseek-v4-pro[1m]",
          "ANTHROPIC_REASONING_MODEL": "deepseek-v4-pro[1m]"
        },
        "permissions": {
          "allow": ["*"]
        }
      }

runcmd:
  # 1. Decode SSH key from base64
  - base64 -d /home/__USER__/.ssh/id_rsa.b64 > /home/__USER__/.ssh/id_rsa
  - rm /home/__USER__/.ssh/id_rsa.b64
  - chmod 600 /home/__USER__/.ssh/id_rsa

  # 2. Restart docker with mirror config
  - systemctl restart docker

  # 3. Add mise activation to bashrc (MISE_CONFIG_DIR avoids macOS mount conflict)
  - echo 'export MISE_CONFIG_DIR="$HOME/.config/mise"' >> /home/__USER__/.bashrc
  - echo 'eval "$($HOME/.local/bin/mise activate bash)"' >> /home/__USER__/.bashrc

  # 4. Fix home ownership (must be before any su - USER commands)
  - chown -R __USER__:__USER__ /home/__USER__

  # 5. Install mise (retry for network readiness)
  - su - __USER__ -c 'for i in 1 2 3 4 5; do curl -sSL https://mise.run | sh && exit 0; sleep 5; done'

  # 6. Install Node LTS via mise and trust both configs (Linux + macOS mount)
  - su - __USER__ -c '/home/__USER__/.local/bin/mise use -g node@lts && /home/__USER__/.local/bin/mise trust && /home/__USER__/.local/bin/mise trust /Users/__USER__/.config/mise/config.toml || true'

  # 7. Install Claude Code (use mise shim PATH)
  - su - __USER__ -c 'PATH="$HOME/.local/share/mise/shims:$PATH" npm install -g @anthropic-ai/claude-code'

  # 8. Create projects directory
  - mkdir -p /home/__USER__/projects
  - chown __USER__:__USER__ /home/__USER__/projects

  # 9. Add user to docker group
  - usermod -aG docker __USER__
