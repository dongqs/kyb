# Vector config — kyb infra log pipeline
# Docker container logs → ClickHouse
# Deployed as kyb-infra-vector on kyb-net

[sources.docker]
type = "docker_logs"
auto_partial_merge = true

[transforms.clean]
type = "remap"
inputs = ["docker"]
source = '''
  # Abort if not from kyb infra containers
  container_name = to_string!(.container_name)
  if !starts_with(container_name, "kyb-infra-") {
    abort
  }

  # Abort empty messages
  message = to_string!(.message)
  if is_empty(message) {
    abort
  }

  # Build clean event
  .container_id = to_string!(.container_id)
  .container_name = container_name
  .message = message
  .stream = to_string!(.stream)
'''

[sinks.clickhouse]
type = "clickhouse"
inputs = ["clean"]
endpoint = "http://kyb-infra-clickhouse:8123"
database = "infra"
table = "container_logs"
batch.timeout_secs = 2
healthcheck.enabled = false

[api]
enabled = true
address = "0.0.0.0:8686"
