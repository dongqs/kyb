# docs/infra/grafana/provisioning/alerting/resources/heartbeat-alerts.yaml
# Alerting rules for boss heartbeat monitoring.
# Data source: ClickHouse, table: boss_heartbeats
# See: docs/infra/reviews/grafana-provisioning.md (Section 6.1)
apiVersion: 1
groups:
  - name: heartbeat-alerts
    folder: kyb-infra-alerts
    interval: 60s
    rules:
      - uid: boss_heartbeat_warn
        title: "Boss Heartbeat Warning (>2 min stale)"
        condition: "A"
        data:
          - refId: A
            queryType: sql
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: clickhouse
            model:
              rawSql: |-
                SELECT
                  boss_id,
                  count() AS heartbeat_count
                FROM boss_heartbeats
                WHERE timestamp > now() - 120
                GROUP BY boss_id
              format: table
        noDataState: Alerting
        execErrState: Alerting
        for: 30s
        annotations:
          summary: "Boss heartbeat warning — {{ $labels.boss_id }} stale for >2 min"
          runbook_url: "docs/infra/patrol-guide.md"
        labels:
          severity: warning
          p: "2"

      - uid: boss_heartbeat_critical
        title: "Boss Heartbeat Critical (>5 min stale)"
        condition: "A"
        data:
          - refId: A
            queryType: sql
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: clickhouse
            model:
              rawSql: |-
                SELECT
                  boss_id,
                  count() AS heartbeat_count
                FROM boss_heartbeats
                WHERE timestamp > now() - 300
                GROUP BY boss_id
              format: table
        noDataState: Alerting
        execErrState: Alerting
        for: 60s
        annotations:
          summary: "BOSS DOWN — {{ $labels.boss_id }} heartbeat missing for >5 min!"
          runbook_url: "docs/infra/disaster-recovery.md"
        labels:
          severity: critical
          p: "1"

      - uid: disk_usage_warning
        title: "Disk Usage > 85%"
        condition: "A"
        data:
          - refId: A
            queryType: sql
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: clickhouse
            model:
              rawSql: |-
                SELECT
                  boss_id,
                  argMax(disk_used_pct, timestamp) AS disk_pct
                FROM boss_heartbeats
                WHERE timestamp > now() - 120
                GROUP BY boss_id
                HAVING disk_pct > 85
              format: table
        for: 5m
        annotations:
          summary: "Disk >85% on {{ $labels.boss_id }} ({{ $values.disk_pct }}%)"
        labels:
          severity: warning
          p: "2"
