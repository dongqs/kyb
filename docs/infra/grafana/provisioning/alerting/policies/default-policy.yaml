# docs/infra/grafana/provisioning/alerting/policies/default-policy.yaml
# Default notification policy for all kyb-infra alerts.
# Routes alerts to the Feishu notifier, grouped by severity.
# See: docs/infra/reviews/grafana-provisioning.md (Section 6.3)
apiVersion: 1
policies:
  - orgId: 1
    receiver: feishu
    group_by: ["severity"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 30m
