# docs/infra/grafana/provisioning/datasources/clickhouse.yaml
# ClickHouse datasource — primary storage for boss heartbeats, cc-connect messages, and MCP logs
# Address: host.orb.internal resolves only on OrbStack macOS. Multi-cluster deployments must
# override via environment variable or GF_DATASOURCES_CLICKHOUSE_URL.
apiVersion: 1

datasources:
  - name: ClickHouse
    type: grafana-clickhouse-datasource
    access: proxy
    url: http://host.orb.internal:8123
    isDefault: true
    editable: false
    jsonData:
      server: host.orb.internal
      port: 8123
      protocol: http
