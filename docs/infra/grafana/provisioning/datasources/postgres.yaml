# docs/infra/grafana/provisioning/datasources/postgres.yaml
# PostgreSQL datasource — cc-connect application data and replication monitoring
# Password stored in secureJsonData; do not commit plaintext credentials to Git.
apiVersion: 1

datasources:
  - name: PostgreSQL
    type: postgres
    access: proxy
    url: host.orb.internal:5432
    database: postgres
    user: postgres
    secureJsonData:
      password: postgres
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    editable: false
